# Static site, no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  # Stamping runs HERE, on every deploy, on purpose. The site has no bundler, so asset
  # filenames never change; a long cache plus a stable name means a returning visitor can
  # get new HTML with an old script, and the board hangs on its loading state (hit live
  # 2026-08-25). Running it at deploy makes correctness structural rather than a step
  # someone has to remember. It is idempotent, and it exits non-zero when the HTML points
  # at an asset that does not exist - a broken reference fails the deploy instead of shipping.
  command = "python3 stamp-assets.py"

[build.processing]
  skip_processing = true

# Headers live in _headers so they also apply when the folder is served by any
# other static host. Netlify reads that file directly.

[[redirects]]
  from = "/data"
  to = "/data/benchmark.json"
  status = 302

# Netlify serves method.html at /method on its own, but the canonical, the
# sitemap and every link on the board point at /method, so the rule is written
# down rather than inherited.
[[redirects]]
  from = "/method"
  to = "/method.html"
  status = 200

[[redirects]]
  from = "/method.html"
  to = "/method"
  status = 301
